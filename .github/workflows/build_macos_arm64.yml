name: Build macOS arm64

on:
  workflow_dispatch:   # manual "Run workflow" button in the Actions tab

jobs:
  build:
    runs-on: macos-14   # GitHub-hosted Apple Silicon (arm64) runner
    timeout-minutes: 180

    steps:
      # Just enough to grab the patch file sitting in your repo.
      - name: Checkout this repo (for the patch file only)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            gb160-custom-changes-vs-2.9.4.patch
          sparse-checkout-cone-mode: false

      # The actual build source is a fresh, official copy of 2.9.6 —
      # not your repo's history. This guarantees a clean base every time.
      - name: Clone upstream PrusaSlicer at 2.9.6
        run: |
          git clone --branch version_2.9.6 --depth 1 \
            https://github.com/prusa3d/PrusaSlicer.git src

      # gmplib.org frequently times out / blocks CI runner IPs (known
      # upstream issue: prusa3d/PrusaSlicer#14517). Swap in the GNU FTP
      # mirror, which serves the identical file (same SHA256 hash).
      - name: Fix flaky GMP download URL
        run: |
          sed -i '' 's#https://gmplib.org/download/gmp/gmp-6.2.1.tar.bz2#https://ftp.gnu.org/gnu/gmp/gmp-6.2.1.tar.bz2#' src/deps/+GMP/GMP.cmake
          grep "URL http" src/deps/+GMP/GMP.cmake

      - name: Apply your custom-features patch
        run: |
          cd src
          git config user.email "you@example.com"
          git config user.name "gb160"
          git apply --3way ../gb160-custom-changes-vs-2.9.4.patch
          git add -A
          git commit -m "Reapply custom changes on top of 2.9.6"

      - name: Install build tools
        run: |
          brew update
          brew install automake gettext libtool texinfo m4 zlib
          curl -L -o cmake.tar.gz https://github.com/Kitware/CMake/releases/download/v3.27.9/cmake-3.27.9-macos-universal.tar.gz
          tar -xzf cmake.tar.gz
          echo "$PWD/cmake-3.27.9-macos-universal/CMake.app/Contents/bin" >> "$GITHUB_PATH"

      - name: Fix m4 PATH ordering
        run: echo "/opt/homebrew/opt/m4/bin" >> "$GITHUB_PATH"

      - name: Cache dependency bundle
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: src/deps/build/destdir
          key: deps-arm64-${{ hashFiles('src/deps/**') }}

      - name: Build dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          cmake --version
          cd src/deps
          mkdir -p build
          cd build
          cmake .. -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0
          make -j"$(sysctl -n hw.ncpu)"

      - name: Build PrusaSlicer
        run: |
          cd src
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_PREFIX_PATH="$PWD/../deps/build/destdir/usr/local" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCMAKE_BUILD_TYPE=Release
          make -j"$(sysctl -n hw.ncpu)"

      - name: Package artifact
        run: |
          cd src/build/src
          if [ -d PrusaSlicer.app ]; then
            ditto -c -k --sequesterRsrc --keepParent PrusaSlicer.app "$GITHUB_WORKSPACE/PrusaSlicer-arm64.zip"
          else
            zip -j "$GITHUB_WORKSPACE/PrusaSlicer-arm64.zip" prusa-slicer
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrusaSlicer-macOS-arm64
          path: PrusaSlicer-arm64.zip
          retention-days: 14
